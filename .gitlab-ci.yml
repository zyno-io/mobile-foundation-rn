image: node:24-alpine

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - e2e
  - deploy
  - mirror

build:
  stage: build
  script:
    - |
      set -x

      apk add git
      corepack enable

      yarn --immutable

      yarn typecheck
      yarn test --runInBand

      rm -rf dist
      npx tsc -p tsconfig.json

      BUILD_VERSION=$(TZ=UTC0 git show -s --format=%cd --date=format-local:'%y.%-m%d.%-H%M' HEAD)

      if [ "$CI_COMMIT_BRANCH" != "main" ]; then
        SHORT_SHA=$(echo "$CI_COMMIT_SHA" | head -c 7)
        BUILD_VERSION="${BUILD_VERSION}-canary.${SHORT_SHA}"
      fi

      npm version ${BUILD_VERSION} --git-tag-version=false
  artifacts:
    paths:
      - dist/
      - package.json

.e2e-base:
  stage: e2e
  needs: []
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip e2e\]/
      when: never
    - when: on_success

e2e:ios:
  extends: .e2e-base
  tags:
    - mac
  variables:
    SENTRY_DISABLE_AUTO_UPLOAD: "true"
  script:
    - |
      # https://docs.expo.dev/troubleshooting/clear-cache-macos-linux/
      rm -fr $TMPDIR/haste-map-*
      rm -rf $TMPDIR/metro-cache
    - |
      export PATH="$HOME/.asdf/shims:$PATH"
      . "$HOME/.asdf/asdf.sh"
      asdf install
      asdf reshim
    - command -v applesimutils >/dev/null || (brew tap wix/brew && brew install applesimutils)
    - corepack enable
    - yarn --immutable
    - bash scripts/test-protected-data-native.sh
    - cd test-app
    - yarn --immutable
    - npx detox build-framework-cache
    - npx expo prebuild --clean --no-install --platform ios
    - grep -q "@generated begin mobile-foundation-sentry-auto-upload" ios/.xcode.env
    - test -f ios/fastlane/Fastfile
    - bundle install
    - LANG=en_US.UTF-8 bundle exec pod install --project-directory=ios
    - npx detox build -c ios.sim.release
    # Disable hardware keyboard so the software keyboard appears and fires keyboard events.
    # The global `defaults write` is not enough — modern Xcode stores the setting per-device
    # in DevicePreferences:<UDID>, which takes precedence. Use PlistBuddy to update all devices.
    - |
      killall "Simulator" 2>/dev/null || true
      xcrun simctl shutdown all 2>/dev/null || true
      defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      PLIST="$HOME/Library/Preferences/com.apple.iphonesimulator.plist"
      if /usr/libexec/PlistBuddy -c "Print :DevicePreferences" "$PLIST" &>/dev/null; then
        /usr/libexec/PlistBuddy -c "Print :DevicePreferences" "$PLIST" \
          | perl -lne 'print $1 if /^ (\S+) =/' \
          | while read -r UDID; do
              /usr/libexec/PlistBuddy -c "Set :DevicePreferences:${UDID}:ConnectHardwareKeyboard false" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :DevicePreferences:${UDID}:ConnectHardwareKeyboard bool false" "$PLIST"
            done
      fi
    - npx detox test -c ios.sim.release --take-screenshots failing
  artifacts:
    when: always
    paths:
      - test-app/artifacts/
    expire_in: 7 days

e2e:android:
  extends: .e2e-base
  image: reactnativecommunity/react-native-android:latest
  tags:
    - kvm
  variables:
    DETOX_ANDROID_AVD: detox_pixel_api_34
    SENTRY_DISABLE_AUTO_UPLOAD: "true"
    ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
  script:
    # Install system image and create AVD
    - |
      sdkmanager "system-images;android-34;google_apis;x86_64"
      if ! avdmanager list avd -c 2>/dev/null | grep -q "$DETOX_ANDROID_AVD"; then
        echo "Creating AVD: $DETOX_ANDROID_AVD"
        echo "no" | avdmanager create avd -n "$DETOX_ANDROID_AVD" -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
      fi
    - corepack enable
    - yarn --immutable
    - cd test-app
    - yarn --immutable
    - npx expo prebuild --clean --no-install --platform android
    - grep -q "@generated begin mobile-foundation-sentry-auto-upload" android/app/build.gradle
    - grep -q "^android.enableMinifyInReleaseBuilds=true$" android/gradle.properties
    - test -f android/fastlane/Appfile
    - npx detox build -c android.emu.release
    - (cd android && ./gradlew --stop)
    # Boot after compilation so Gradle and the emulator do not compete for memory.
    - |
      emulator -avd "$DETOX_ANDROID_AVD" -no-window -no-audio -no-boot-anim -gpu swiftshader -feature -Vulkan -no-snapshot -partition-size 2048 &
      adb wait-for-device
      echo "Device detected, waiting for boot..."
      SECONDS=0
      while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
        if [ $SECONDS -ge 600 ]; then
          echo "ERROR: Boot timed out after ${SECONDS}s"
          exit 1
        fi
        sleep 5
      done
      echo "Boot completed in ${SECONDS}s"
    # Stabilize animations and ensure keyboard tests use the software keyboard.
    - |
      adb shell settings put global window_animation_scale 0
      adb shell settings put global transition_animation_scale 0
      adb shell settings put global animator_duration_scale 0
      adb shell settings put secure autofill_service null
      adb shell settings put secure show_ime_with_hard_keyboard 1
    - |
      mkdir -p artifacts
      adb logcat -b all -v threadtime > artifacts/emulator.log 2>&1 &
      ANDROID_LOGCAT_PID=$!
      trap 'kill "$ANDROID_LOGCAT_PID" 2>/dev/null || true' EXIT
      npx detox test -c android.emu.release --headless --take-screenshots failing --record-logs all
  after_script:
    - adb emu kill 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - test-app/artifacts/
    expire_in: 7 days

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip deploy\]/
      when: never
    - when: on_success
  script:
    - |
      npm config set -- //${PRIVATE_NPM_HOST}/:_authToken="${PRIVATE_NPM_PUBLISHER_TOKEN}"

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        npm publish --registry https://${PRIVATE_NPM_HOST}/

        npm config set //registry.npmjs.org/:_authToken="${NPM_PUBLISH_TOKEN}"
        npm publish --registry https://registry.npmjs.org/ --access public
      else
        npm publish --registry https://${PRIVATE_NPM_HOST}/ --tag canary
      fi

mirror:
  stage: mirror
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  image:
    name: alpine/git
    entrypoint: ['']
  script: |
    export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
    mkdir ~/.ssh
    echo $GITHUB_SSH_KEY_B64 | base64 -d > ~/.ssh/id_ed25519
    chmod 600 ~/.ssh/id_ed25519
    git remote add github git@github.com:zyno-io/mobile-foundation-rn.git
    git push -u github HEAD:main --force

osv scan:
  stage: test
  allow_failure: true
  image:
    name: ghcr.io/google/osv-scanner:latest
    entrypoint: ['']
  before_script: []
  script:
    - /osv-scanner scan source --recursive .
